<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="45%" stop-color="#140a33"/>
      <stop offset="100%" stop-color="#2b0f5e"/>
    </linearGradient>

    <radialGradient id="galaxyCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- Rotating galaxy -->
  <g transform="translate(450,130)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="260" ry="90" fill="url(#galaxyCore)" filter="url(#blurBig)"/>
      <ellipse cx="0" cy="0" rx="150" ry="150" fill="url(#galaxyCore)" filter="url(#blurBig)" opacity="0.6"/>
    </g>
  </g>

  <!-- Twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="30" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="200" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="60" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="220" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="35" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="210" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="50" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="190" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="150" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="180" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="230" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Shooting stars -->
  <g stroke="#ffffff" stroke-linecap="round">
    <line x1="0" y1="0" x2="70" y2="35" stroke-width="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="-100,-40; 950,260" dur="3.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="60" y2="30" stroke-width="1.6" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="-100,-20; 950,220" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="55" y2="28" stroke-width="1.4" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="-100,10; 950,280" dur="5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Name -->
  <text x="450" y="145" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="64" font-weight="700" fill="url(#textGlow)" filter="url(#softGlow)">
    Shanilka
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>

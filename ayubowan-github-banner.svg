<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050005"/>
      <stop offset="55%" stop-color="#170022"/>
      <stop offset="100%" stop-color="#3a0a4a"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#a020c0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a020c0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#e254f0"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="neonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>
  <ellipse cx="450" cy="115" rx="420" ry="160" fill="url(#glowSpot)"/>

  <!-- Ayubowan text -->
  <text x="450" y="140" text-anchor="middle" font-family="Noto Sans Sinhala, Iskoola Pota, Yaldevi, sans-serif"
        font-size="74" font-weight="700" fill="url(#textGrad)" filter="url(#neonGlow)">
    ආයුබෝවන්
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- binary decoration -->
  <text x="450" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e5c8ff" opacity="0.35" letter-spacing="2">
    01101001 01101100 01101111 01110110 01100101 00100000 01100011 01101111 01100100 01100101
  </text>

  <!-- code pill (bottom-left) -->
  <g transform="translate(28,208)">
    <rect width="86" height="30" rx="15" fill="url(#pillGrad)" stroke="#e9b8ff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="43" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#f3e6ff" font-weight="600">&lt;/&gt; code</text>
  </g>
</svg>
